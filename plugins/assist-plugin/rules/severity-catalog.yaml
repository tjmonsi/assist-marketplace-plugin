# Severity catalog: assist-plugin
#
# This file is the editable, measurable source of truth for the fixed severity of each rule identifier. A maintainer
# revises a value with data (a CWE mapping, a CVSS band, the reviewer-precision report), never with text a model wrote.
# Nothing here is derived from model-interpreted text. The policy that governs it is rules/severity-policy.md (see
# "Severity catalog" there); hooks/lib/severity.js reads it. Editing this file raises the policy version and needs the
# re-approval entry that FR-237 requires.
#
# Format (a strict, flat-map subset of YAML; the reader in hooks/lib/severity.js has no dependency):
#   - A comment is a line whose first non-space character is "#". No comment may follow a value on the same line.
#   - An entry is a rule identifier at column 0 followed by a colon and nothing else.
#   - Each entry has exactly two fields, each on its own line indented by exactly two spaces: "severity" and "basis".
#   - severity is CRITICAL, HIGH, MEDIUM, or LOW (upper case).
#   - basis is a CWE identifier written CWE-<number> when the rule maps to a known weakness class, else a short lower-case
#     token. The token "measured-precision" marks a value revisable from the reviewer-precision report: the initial value
#     is provisional and ranks the item by the nature of what it finds, until labelled findings give it a measured basis.
#   - A duplicate identifier, an unknown field, a missing field, a bad severity, a tab, or any other line makes the reader
#     discard the whole file; the orchestrator then keeps each reviewer's severity as written.
#
# Ranking rule for the initial values (rules/severity-policy.md, Rubric and Levels): an item whose finding is an
# injection, an authorization, a credential, or a fail-open defect ranks HIGH; a defect that harms availability, data
# correctness, or a rendered page ranks MEDIUM; hygiene and test-quality drift with no direct path to a protected asset
# ranks LOW. An item that a reviewer finds as a real bug never ranks below a style or wording item.
#
# Scanner rules (the last block) carry the severity the scanner in hooks/lib/code-rules.js already assigns, so the catalog
# and the scanner agree. The scanner's confidence stays in code-rules.js; the catalog fixes severity only.

